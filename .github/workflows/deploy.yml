name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4        # версию берёт из package.json → packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # pnpm 11 требует Node >= 22.13 (node:sqlite)
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck & test
        run: |
          pnpm run typecheck
          pnpm run test

      - name: Build
        run: pnpm run build-only

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
